services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: curlhard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in deploy/.env setzen}
      POSTGRES_DB: curlhard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curlhard -d curlhard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: &log
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    image: ghcr.io/${GHCR_OWNER:-owner}/curlhard-api:${CURLHARD_TAG:-latest}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://curlhard:${POSTGRES_PASSWORD}@db:5432/curlhard
    depends_on:
      db: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    logging: *log

  web:
    image: ghcr.io/${GHCR_OWNER:-owner}/curlhard-web:${CURLHARD_TAG:-latest}
    # TLS terminiert der Host-Nginx und leitet an 127.0.0.1:8080 weiter
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    logging: *log

  # Optional: Cloudflare Tunnel statt Host-Nginx (aktiv mit COMPOSE_PROFILES=tunnel).
  # Public Hostname im Cloudflare-Dashboard auf http://web:80 zeigen lassen.
  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles: [tunnel]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [web]
    restart: unless-stopped
    logging: *log

volumes:
  pgdata:
