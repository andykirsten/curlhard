# Lokale Entwicklungs-Datenbank: `docker compose -f docker-compose.dev.yaml up -d db`
# Legt `curlhard` (Dev) an; Test- und E2E-Datenbank werden bei Bedarf automatisch erzeugt.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: curlhard
      POSTGRES_PASSWORD: curlhard
      POSTGRES_DB: curlhard
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - devdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curlhard -d curlhard"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  devdata:
